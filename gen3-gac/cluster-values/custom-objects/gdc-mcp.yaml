apiVersion: v1
kind: ConfigMap
metadata:
  name: gdc-agent-model-config
  namespace: default
data:
  model-config.yaml: |
    backends:
      - provider: local
        name: meta-models/Muse-Glimmer-30B
        alias: (On-Prem) Meta Muse Glimmer 30B
        env_prefix: MUSE_API
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gdc-agent
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gdc-agent
  template:
    metadata:
      labels:
        app: gdc-agent
    spec:
      containers:
        - name: agent
          image: 707767160287.dkr.ecr.us-east-1.amazonaws.com/gen3/gdc-mcp-demo-agent:agent
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: agent-api-keys
          env:
            - name: AGENT_PORT
              value: "8000"
            - name: MCP_PORT
              value: "8001"
            - name: COMMONS_URL
              value: "genomicaicommons.org"
          args:
            - "--port"
            - "$(AGENT_PORT)"
            - "--mcp-url"
            - "http://gdc-mcp:$(MCP_PORT)/mcp"
            - "--model-config"
            - "model-config.yaml"
            - "--retries"
            - "3"
          ports:
            - name: http
              containerPort: 8000
          volumeMounts:
            - name: model-config
              mountPath: /app/model-config.yaml
              subPath: model-config.yaml
              readOnly: true
      volumes:
        - name: model-config
          configMap:
            name: gdc-agent-model-config
---
apiVersion: v1
kind: Service
metadata:
  name: gdc-agent
  namespace: default
spec:
  type: NodePort
  selector:
    app: gdc-agent
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gdc-mcp
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gdc-mcp
  template:
    metadata:
      labels:
        app: gdc-mcp
    spec:
      containers:
        - name: mcp
          image: 707767160287.dkr.ecr.us-east-1.amazonaws.com/gen3/gdc-mcp-demo-mcp:agent
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: agent-api-keys
          env:
            - name: MCP_PORT
              value: "8001"
            - name: EMBED_API_URL
              value: http://conduit-server.default.svc.cluster.local:8080/sapbert/v1/
          args:
            - "-t"
            - "streamable-http"
            - "-p"
            - "$(MCP_PORT)"
          ports:
            - name: http
              containerPort: 8001
          startupProbe:
            tcpSocket: { port: http }
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            tcpSocket: { port: http }
---
apiVersion: v1
kind: Service
metadata:
  name: gdc-mcp
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: gdc-mcp
  ports:
    - name: http
      port: 8001
      targetPort: http

{{- $env := .Values.env }}
{{- $ns := .Release.Namespace }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: siem-service
  {{- if .Values.crossplane.enabled }}
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::{{ .Values.crossplane.accountId }}:role/{{ .Values.environment }}-{{ .Release.Namespace }}-{{ .Values.serviceAccount.name }}
  {{- else }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
---
{{- $persist := .Values.cache.persistent }}
apiVersion: apps/v1
kind: {{ if $persist }}StatefulSet{{ else }}Deployment{{ end }}
metadata:
  name: siem-service
  namespace: {{ $ns }}
  labels:
    app: siem-service
spec:
  replicas: {{ .Values.replicaCount }}
  {{- if $persist }}
  # Each replica keeps its own cache volume across restarts, spot reclaims and reschedules (an EBS volume belongs to one replica and one
  # zone). Both replicas start together: the cache is rebuilt in parallel the first time, and reused after that.
  serviceName: siem-service
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  # A volume is deleted with the StatefulSet or when it is scaled down: a cache is never worth keeping (and would cost money, unread).
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Delete
    whenScaled: Delete
  {{- end }}
  selector:
    matchLabels:
      app: siem-service
  template:
    metadata:
      labels:
        app: siem-service
      annotations:
        # The warm and hot caches live on this node's disk and take minutes to build (readiness is 503 meanwhile, and reads fall back to slow
        # S3 scans). Karpenter's "Underutilized" consolidation moved both pods within five minutes of a rollout, so every move was a cold start.
        karpenter.sh/do-not-disrupt: "true"
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: siem-service
        {{- if $persist }}
        # Replicas in different zones: a cache volume stays in its zone, so one zone short of spot capacity must not hold both replicas down.
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: siem-service
        {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: siem-service
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8000
              name: http
          env:
            # --- authorization: required, the pod refuses to start without it ---
            - name: SIEM_AUTH_MODE
              value: "arborist"
            - name: SIEM_ENV
              value: {{ required "env.SIEM_ENV must be set (production)" $env.SIEM_ENV | quote }}
            - name: ARBORIST_URL
              value: {{ .Values.arboristUrl | default (printf "http://arborist-service.%s.svc.cluster.local" $ns) | quote }}
            - name: FENCE_URL
              value: {{ .Values.fenceUrl | default (printf "http://fence-service.%s.svc.cluster.local" $ns) | quote }}
            - name: SIEM_ARBORIST_SERVICE
              value: {{ $env.SIEM_ARBORIST_SERVICE | default "siem" | quote }}
            - name: SIEM_AUTH_CACHE_TTL
              value: {{ $env.SIEM_AUTH_CACHE_TTL | default "30" | quote }}
            - name: SIEM_TENANTS
              value: {{ required "env.SIEM_TENANTS must be set" $env.SIEM_TENANTS | quote }}
            - name: SIEM_SHARED_TENANTS
              value: {{ $env.SIEM_SHARED_TENANTS | default "" | quote }}
            # --- data source ---
            - name: AWS_REGION
              value: {{ $env.AWS_REGION | default "us-east-1" | quote }}
            - name: AWS_DEFAULT_REGION
              value: {{ $env.AWS_REGION | default "us-east-1" | quote }}
            - name: AWS_USE_FIPS_ENDPOINT            # required by the S3 reader
              value: "true"
            - name: GRAPH_DUCKDB_S3_ENDPOINT         # documented FIPS exception for the delta extension
              value: {{ $env.GRAPH_DUCKDB_S3_ENDPOINT | default "regional" | quote }}
            - name: GRAPH_BUCKET
              value: {{ required "env.GRAPH_BUCKET must be set" $env.GRAPH_BUCKET | quote }}
            - name: GRAPH_TENANT
              value: {{ required "env.GRAPH_TENANT must be set" $env.GRAPH_TENANT | quote }}
            - name: GRAPH_NAMESPACES
              value: {{ $env.GRAPH_NAMESPACES | default "" | quote }}
            # Sizes follow the container: "4x" is four times its CPU limit (S3 scans wait on reads, so the S3 reader
            # oversubscribes on purpose), "35%" is a share of its memory, "15%" of the cache volume. Fixed values still work.
            - name: GRAPH_DUCKDB_THREADS
              value: {{ $env.GRAPH_DUCKDB_THREADS | default "4x" | quote }}
            - name: GRAPH_DUCKDB_MEMORY_LIMIT
              value: {{ $env.GRAPH_DUCKDB_MEMORY_LIMIT | default "35%" | quote }}
            - name: GRAPH_DUCKDB_MAX_TEMP_SIZE
              value: {{ $env.GRAPH_DUCKDB_MAX_TEMP_SIZE | default "15%" | quote }}
            # --- the cache volume: warm and hot tables live in DuckDB files here, not in RAM ---
            - name: SIEM_CACHE_DIR
              value: "/cache"
            {{- if $persist }}
            - name: SIEM_CACHE_PERSIST          # the volume outlives the pod: reuse the cache files after a restart, top them up from the log
              value: "true"
            {{- end }}
            - name: SIEM_CACHE_VOLUME_BYTES
              value: {{ mul (int64 .Values.cache.sizeGi) 1073741824 | quote }}
            - name: GRAPH_DUCKDB_TEMP_DIR
              value: "/cache/tmp"
            {{- range $name := list "SIEM_CACHE_DISK_PERCENT" "SIEM_CACHE_ROW_BYTES" "SIEM_WARM_DAYS" "SIEM_WARM_MAX_ROWS" "SIEM_WARM_RETRY_SECONDS" "SIEM_WARM_EXCLUDE_LABELS" "SIEM_WARM_FRESH_SECONDS" "SIEM_HOT_EXCLUDE_SOURCES" "SIEM_STATE_MAX_AGE_SECONDS" "SIEM_FULL_RELOAD_SECONDS" "SIEM_CREDENTIALS_UNHEALTHY_SECONDS" "SIEM_WARM_FULL_RELOAD_SECONDS" "SIEM_CACHE_EDGE_ROW_BYTES" "SIEM_TENANT_DUCKDB_MAX_TEMP_SIZE" "SIEM_WARM_READY_TIMEOUT_SECONDS" "SIEM_WARM_LOAD_THREADS" "SIEM_WARM_MAX_AGE_SECONDS" "SIEM_WARM_REFRESH_SECONDS" "SIEM_HOT_ON_DISK" }}
            {{- if hasKey $env $name }}
            - name: {{ $name }}
              value: {{ get $env $name | quote }}
            {{- end }}
            {{- end }}
            - name: SIEM_THREAT_INDICATOR_LABELS
              value: {{ $env.SIEM_THREAT_INDICATOR_LABELS | default "Indicator" | quote }}
            - name: SIEM_HOT_WINDOW_DAYS
              value: {{ $env.SIEM_HOT_WINDOW_DAYS | default "7" | quote }}
            - name: GRAPH_SOURCE_CACHE_TTL_SECONDS
              value: {{ $env.GRAPH_SOURCE_CACHE_TTL_SECONDS | default "300" | quote }}
            # --- the data dictionary: the allowlist of columns a query may name ---
            - name: SIEM_DICTIONARY_S3_BUCKET
              value: {{ $env.SIEM_DICTIONARY_S3_BUCKET | default $env.GRAPH_BUCKET | quote }}
            - name: SIEM_DICTIONARY_S3_KEY
              value: {{ $env.SIEM_DICTIONARY_S3_KEY | default "config/dd/current.json" | quote }}
            # --- other buckets / optional pipeline view ---
            - name: SIEM_RAW_BUCKET
              value: {{ $env.SIEM_RAW_BUCKET | default $env.GRAPH_BUCKET | quote }}
            - name: SIEM_QUARANTINE_BUCKET
              value: {{ $env.SIEM_QUARANTINE_BUCKET | default $env.GRAPH_BUCKET | quote }}
            {{- if $env.SIEM_MQ_QUEUES }}
            - name: SIEM_MQ_QUEUES
              value: {{ $env.SIEM_MQ_QUEUES | quote }}
            {{- end }}
            - name: SIEM_SOURCE_EXPECTATIONS
              value: {{ $env.SIEM_SOURCE_EXPECTATIONS | default "{}" | quote }}
            # --- SOC router ---
            - name: SIEM_REFRESH_SECONDS
              value: {{ $env.SIEM_REFRESH_SECONDS | default "10" | quote }}
            - name: SIEM_HOT_EVENTS_HOURS
              value: {{ $env.SIEM_HOT_EVENTS_HOURS | default "168" | quote }}
            - name: SIEM_HOT_MAX_ROWS
              value: {{ $env.SIEM_HOT_MAX_ROWS | default "3000000" | quote }}
            - name: SIEM_TENANT_DUCKDB_MEMORY_LIMIT
              value: {{ $env.SIEM_TENANT_DUCKDB_MEMORY_LIMIT | default "20%" | quote }}
            - name: SIEM_PII_COLUMNS
              value: {{ $env.SIEM_PII_COLUMNS | default "user_hash,principal_arn,user_id" | quote }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /cache
          # The startup probe only covers a slow Python start: /siem/health answers as soon as the service is up and does NOT wait for
          # the cache. Readiness is what waits for the first cache load (up to SIEM_WARM_READY_TIMEOUT_SECONDS) and keeps traffic away.
          startupProbe:
            httpGet:
              path: /siem/health
              port: 8000
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /siem/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /siem/health
              port: 8000
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- /* The kubelet evicts a pod that writes more than its ephemeral-storage LIMIT: the cache volume, /tmp and a margin.
                   It is a limit only (no request), so it can never make the pod unschedulable on a small node disk. */}}
            {{- $res := deepCopy .Values.resources }}
            {{- $limits := default (dict) $res.limits }}
            {{- if not (hasKey $limits "ephemeral-storage") }}
            {{- /* With a persistent volume the cache is not ephemeral storage: only /tmp and the container's own layer count. */}}
            {{- $_ := set $limits "ephemeral-storage" (ternary "8Gi" (printf "%dGi" (add (int .Values.cache.sizeGi) 6)) $persist) }}
            {{- end }}
            {{- $_ := set $res "limits" $limits }}
            {{- toYaml $res | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.tmpSizeLimit | default "5Gi" }}
        {{- if not $persist }}
        # The cache lives on the node's disk, so the node volume must be larger than this (see cache.sizeGi in values.yaml). It is
        # rebuilt from S3 on every start; nothing is trusted from a previous run.
        - name: cache
          emptyDir:
            sizeLimit: {{ .Values.cache.sizeGi }}Gi
        {{- end }}
  {{- if $persist }}
  volumeClaimTemplates:
    - metadata:
        name: cache
        labels:
          app: siem-service
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.cache.storageClass | quote }}
        resources:
          requests:
            storage: {{ .Values.cache.sizeGi }}Gi
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: siem-service
  namespace: {{ $ns }}
  labels:
    app: siem-service
spec:
  type: ClusterIP
  selector:
    app: siem-service
  ports:
    - name: http
      port: 8000
      targetPort: 8000
{{- if gt (int .Values.replicaCount) 1 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: siem-service
  namespace: {{ $ns }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: siem-service
{{- end }}
{{- if .Values.networkPolicy.enabled }}
---
# The service enforces authorization itself; this additionally limits who can even connect (the portal and the revproxy).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: siem-service-from-portal
  namespace: {{ $ns }}
spec:
  podSelector:
    matchLabels:
      app: siem-service
  policyTypes: ["Ingress"]
  ingress:
    - from:
        {{- range .Values.networkPolicy.allowedPodLabels }}
        - podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
        {{- end }}
      ports:
        - port: 8000
{{- end }}
{{- if and .Values.cache.persistent .Values.cache.createStorageClass }}
---
# Cluster-scoped. Off by default: if the Argo project may not manage cluster resources, apply this once by hand instead (the same manifest).
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .Values.cache.storageClass }}
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
  fsType: ext4
  {{- with .Values.cache.iops }}
  iops: {{ . | quote }}
  {{- end }}
  {{- with .Values.cache.throughput }}
  throughput: {{ . | quote }}
  {{- end }}
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
{{- end }}

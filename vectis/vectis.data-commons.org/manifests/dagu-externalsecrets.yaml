# Dagu's two secrets, generated INSIDE the cluster by External Secrets: nothing in AWS, nothing in git, nobody has to know them. Only the Dagu
# pod reads them. dagu-basic is Dagu's own login (the gate adds it to every request it forwards); dagu-owner-key is the key behind the
# run-ownership labels. refreshInterval "0" creates each once and never changes it. Deleting dagu-owner-key makes a new key, so earlier
# runs would no longer show for their owners.
# The two secrets Jobs needs, generated INSIDE the cluster by External Secrets (nothing in AWS, nothing in git, nobody has to know them):
#   dagu-basic       Dagu's own login, read only by the Dagu pod (the gate adds it; the portal never holds it)
#   portal-jobs-env  JOBS_OWNER_HMAC_KEY, the portal's key for the run-ownership labels
# refreshInterval "0" creates each value once and never changes it. Deleting an ExternalSecret deletes its Secret, and a new one is
# generated (a new ownership key makes earlier runs invisible to their owners, so don't delete portal-jobs-env casually).
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: strong-random
  namespace: default
spec:
  length: 48
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: dagu-basic
  namespace: default
spec:
  refreshInterval: "0"
  target:
    name: dagu-basic
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        username: dagu
        password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: Password, name: strong-random}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: portal-jobs-env
  namespace: default
spec:
  refreshInterval: "0"
  target:
    name: portal-jobs-env
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        JOBS_OWNER_HMAC_KEY: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: Password, name: strong-random}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: dagu-owner-key
  namespace: default
spec:
  refreshInterval: "0"
  target:
    name: dagu-owner-key
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        key: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: Password, name: strong-random}
---
# The one secret that cannot be generated: a read-only GitHub token for the private catalog repository (uc-cdis/iso-data-platform), read
# only by the jobs-catalog pod. Create a fine-grained token with read-only "Contents" access to that repository alone and store it in AWS
# Secrets Manager as
#   vectis-jobs-catalog-token   JSON {"token": "github_pat_..."}
# (the external-secrets role must be allowed to read it). Until it exists the catalog service still runs and reports an error.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: jobs-catalog-github
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gen3-secret-store
    kind: SecretStore
  target:
    name: jobs-catalog-github
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef: {key: vectis-jobs-catalog-token, property: token}

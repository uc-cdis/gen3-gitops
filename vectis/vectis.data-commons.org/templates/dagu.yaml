# Dagu, the workflow server behind the Jobs page. The chart comes straight from upstream (not gen3-helm), pinned to a release tag;
# the image tag is set in values/dagu-values.yaml. Only the portal reaches it (ClusterIP service dagu-ui:8080).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gen3-vectis-dagu
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - path: charts/dagu
      repoURL: https://github.com/dagucloud/dagu
      targetRevision: v2.19.1
      helm:
        releaseName: dagu
        valueFiles:
          - $values/vectis/vectis.data-commons.org/values/dagu-values.yaml
    - repoURL: 'https://github.com/uc-cdis/gen3-gitops.git'
      targetRevision: feat/vectis
      ref: values
  destination:
    server: "https://kubernetes.default.svc"
    namespace: default
  syncPolicy:
    automated:
      selfHeal: true

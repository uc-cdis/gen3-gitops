global:
  aws:
    enabled: true
    account: "172585802910"
    hatchery_role: "arn:aws:iam::172585802910:role/gen3-service/vectis-default-hatchery-sa"
    secretStoreServiceAccount:
      enabled: true
      name: external-secrets
      roleArn: "arn:aws:iam::172585802910:role/gen3_service/vectis-default-external-secrets-sa"
    wafv2:
      enabled: true
      wafAclArn: "arn:aws:wafv2:us-east-1:172585802910:regional/webacl/vectis-waf/b91e7abb-d3eb-4733-b2ea-4fea96c6ed5e"
  dev: false
  externalSecrets:
    deploy: true
  postgres:
    dbCreate: true
    externalSecret: "vectis-aurora-master-password"
  environment: "vectis"
  hostname: "vectis.data-commons.org"
  revproxyArn: "arn:aws:acm:us-east-1:172585802910:certificate/d9a98702-17a2-4207-b212-30c043caccdb"
  dictionaryUrl: "https://s3.amazonaws.com/dictionary-artifacts/datadictionary/develop/schema.json"
  portalApp: gitops
  publicDataSets: false
  tierAccessLevel: "private"
  tierAccessLimit: "100"
  netPolicy:
    enabled: false
  dispatcherJobNum: "10"
  frontendRoot: "portal"
  ddEnabled: false

ambassador:
  enabled: true

arborist:
  enabled: true
  externalSecrets:
    dbcreds: "vectis-default-arborist-creds"

argo-wrapper:
  enabled: false

audit:
  enabled: true
  serviceAccount:
    annotations:
      eks.amazonaws.com/role-arn: "arn:aws:iam::172585802910:role/gen3_service/vectis-default-audit-sa"
  externalSecrets:
    dbcreds: "vectis-default-audit-creds"
    createK8sAuditSecret: true


aws-es-proxy:
  # Replaced by the production Lambda search/query services.
  enabled: false
  esEndpoint: ""
  externalSecrets:
    awsCreds: "vectis-default-aws-es-proxy-creds"

dicom-server:
  enabled: false
  externalSecrets:
    dbcreds: "vectis-default-dicom-server-creds"

dicom-viewer:
  enabled: false
  externalSecrets:
    dbcreds: "vectis-default-dicom-viewer-creds"

etl:
  # Replaced by the production Lambda ingestion pipeline.
  enabled: false


fence:
  enabled: true
  serviceAccount:
    annotations:
      eks.amazonaws.com/role-arn: "arn:aws:iam::172585802910:role/gen3_service/vectis-default-fence-sa"

  externalSecrets:
    fenceJwtKeys: "vectis-default-fence-jwt-keys"
    fenceConfig: "vectis-default-fence-config"
    fenceGoogleAppCredsSecret: ""
    fenceGoogleStorageCredsSecret: ""
    createK8sGoogleAppSecrets: true
    dbcreds: "vectis-default-fence-creds"

  usersync:
    usersync: true
    schedule: "*/30 * * * *"
    syncFromDbgap: false
    userYamlS3Path: "s3://cdis-gen3-users/dev/user.yaml"
    slack_webhook: ""
    slack_send_dbgap: false

frontend-framework:
  enabled: true
  image:
    repository: "quay.io/cdis/gen3-vectis"
    # Build and push this production image before merging GitOps.
    tag: "vectisprodv1"
    pullPolicy: Always
  env:
    NODE_ENV: production
    HOSTNAME: "0.0.0.0"
    PORT: "3000"
    NEXT_PUBLIC_GEN3_COMMONS_NAME: vectis
    NEXT_PUBLIC_DATACOMMONS: commons_frontend_app
    HATCHERY_URL: "http://hatchery-service.default.svc.cluster.local"
    GEN3_FENCE_SERVICE: "http://fence-service.default.svc.cluster.local"
    GEN3_ARBORIST_SERVICE: "http://arborist-service.default.svc.cluster.local"
    GEN3_SEARCH_SERVICE: "https://s6fftu5704.execute-api.us-east-1.amazonaws.com"
    GEN3_LAMBDA_API_URL: "https://s6fftu5704.execute-api.us-east-1.amazonaws.com"
    GEN3_INDEXD_SERVICE: "https://vectis.data-commons.org"
    SIEM_SERVICE_DNS: "siem-service.default.svc.cluster.local"
    JUPYTER_GATEWAY_URL: "http://jupyter-enterprise-gateway.jupyter-pods-vectis.svc.cluster.local:8888"
    GEN3_ENDPOINT: "https://vectis.data-commons.org"
    FENCE_URL: "http://fence-service.default.svc.cluster.local"
    KERNEL_SPEC_POLICY: "{}"
    ENABLE_JEG: "true"

grafana:
  enabled: false

guppy:
  enabled: false

hatchery:
  enabled: true

  hatchery:
    sidecarContainer:
      cpu-limit: '0.1'
      memory-limit: 256Mi
      image: quay.io/cdis/ecs-ws-sidecar:master
      env:
        NAMESPACE: "{{ .Release.Namespace }}"
        HOSTNAME: "{{ .Values.global.hostname }}"
      args: []
      command:
      - "/bin/bash"
      - "./sidecar.sh"
      lifecycle-pre-stop:
      - su
      - "-c"
      - echo test
      - "-s"
      - "/bin/sh"
      - root
    containers:
      -
        target-port: 8888
        cpu-limit: '1.0'
        memory-limit: 2Gi
        name: "(Tutorials) Example Analysis Jupyter Lab Notebooks"
        image: quay.io/cdis/heal-notebooks:combined_tutorials__latest
        env:
          FRAME_ANCESTORS: https://{{ .Values.global.hostname }}
        args:
        - "--NotebookApp.base_url=/lw-workspace/proxy/"
        - "--NotebookApp.default_url=/lab"
        - "--NotebookApp.password=''" #pragma: allowlist secret
        - "--NotebookApp.token=''"
        - "--NotebookApp.shutdown_no_activity_timeout=5400"
        - "--NotebookApp.quit_button=False"
        command:
        - start-notebook.sh
        path-rewrite: "/lw-workspace/proxy/"
        use-tls: 'false'
        ready-probe: "/lw-workspace/proxy/"
        lifecycle-post-start:
        - "/bin/sh"
        - "-c"
        - export IAM=`whoami`; rm -rf /home/$IAM/pd/dockerHome; rm -rf /home/$IAM/pd/lost+found;
          ln -s /data /home/$IAM/pd/; true
        user-uid: 1000
        fs-gid: 100
        user-volume-location: "/home/jovyan/pd"
        gen3-volume-location: "/home/jovyan/.gen3"


indexd:
  enabled: true
  defaultPrefix: "dg.vectis/"
  externalSecrets:
    dbcreds: "vectis-default-indexd-creds"
    createK8sServiceCredsSecret: true


manifestservice:
  # Served by the production Lambda-backed APIs.
  enabled: false
  serviceAccount:
    annotations:
      eks.amazonaws.com/role-arn: "arn:aws:iam::172585802910:role/gen3_service/vectis-default-manifestservice-sa"
  externalSecrets:
    createK8sManifestServiceSecret: true

metadata:
  # /mds is served by the production search Lambda.
  enabled: false
  externalSecrets:
    dbcreds: "vectis-default-metadata-creds"
    createK8sMetadataSecret: true

peregrine:
  # Replaced by the production Lambda query service.
  enabled: false
  externalSecrets:
    dbcreds: "vectis-default-sheepdog-creds"

pidgin:
  enabled: false

portal:
  enabled: false

requestor:
  enabled: false
  externalSecrets:
    dbcreds: "vectis-default-requestor-creds"

revproxy:
  enabled: true
  additionalConfigs:
    vectis-lambda.conf: |-
      location /guppy/ {
        proxy_set_header Authorization "$access_token";
        proxy_ssl_server_name on;
        set $upstream https://s6fftu5704.execute-api.us-east-1.amazonaws.com;
        proxy_set_header Host s6fftu5704.execute-api.us-east-1.amazonaws.com;
        rewrite ^/guppy/(.*) /search/$1 break;
        proxy_pass $upstream;
        client_max_body_size 0;
      }

      location /siem/ {
        if ($csrf_check !~ ^ok-\S+$) { return 403 "failed csrf check"; }
        set $upstream http://siem-service.default.svc.cluster.local:8000;
        proxy_pass $upstream;
        client_max_body_size 0;
      }

      location /mds/ {
        proxy_set_header Authorization "$access_token";
        proxy_ssl_server_name on;
        set $upstream https://s6fftu5704.execute-api.us-east-1.amazonaws.com;
        proxy_set_header Host s6fftu5704.execute-api.us-east-1.amazonaws.com;
        proxy_pass $upstream;
        client_max_body_size 0;
      }

      location = /graphql {
        proxy_set_header Authorization "$access_token";
        proxy_ssl_server_name on;
        set $upstream https://s6fftu5704.execute-api.us-east-1.amazonaws.com;
        proxy_set_header Host s6fftu5704.execute-api.us-east-1.amazonaws.com;
        rewrite ^/graphql$ /query/vectis/graphql break;
        proxy_pass $upstream;
        client_max_body_size 0;
      }

      location /api/v0/indexd/ {
        proxy_set_header Authorization "$access_token";
        proxy_ssl_server_name on;
        set $upstream https://s6fftu5704.execute-api.us-east-1.amazonaws.com;
        proxy_set_header Host s6fftu5704.execute-api.us-east-1.amazonaws.com;
        rewrite ^/api/v0/indexd/(.*) /indexd/$1 break;
        proxy_pass $upstream;
        client_max_body_size 0;
      }

      location ^~ /ga4gh/drs/v1/ {
        if ($csrf_check !~ ^ok-\S+$) { return 403 "failed csrf check"; }
        proxy_set_header Authorization "$access_token";
        proxy_ssl_server_name on;
        set $upstream https://s6fftu5704.execute-api.us-east-1.amazonaws.com;
        proxy_set_header Host s6fftu5704.execute-api.us-east-1.amazonaws.com;
        rewrite ^/ga4gh/drs/v1/(.*) /drs/v1/$1 break;
        proxy_pass $upstream;
        client_max_body_size 0;
      }

sheepdog:
  # Replaced by the production Lambda query service.
  enabled: false
  externalSecrets:
    dbcreds: "vectis-default-sheepdog-creds"

ssjdispatcher:
  enabled: false

sower:
  enabled: false

wts:
  enabled: true
  externalSecrets:
    dbcreds: "vectis-default-wts-creds"
    createK8sWtsSecret: true

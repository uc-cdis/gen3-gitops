cluster: vectis
project: vectis
accountNumber: "172585802910"
configuration:
  configurationRevision: master
alb-controller:
  enabled: true
  configuration:
    enabled: false
calico:
  enabled: true
  configuration:
    enabled: false
coreDNS:
  enabled: true
  configuration:
    enabled: false
grafana-alloy:
  enabled: true
  configuration:
    enabled: false
karpenter:
  enabled: true
  targetRevision: "1.9.0"
  configuration:
    enabled: false
karpenter-crds:
  amiSelectorName: "EKS-1-35-x86-x64-AL23*"
  enabled: true
  selectorTag: vectis
  migration: true
  default:
    disruptionBudget: "80%"
    nodeClassRef:
      apiVersion: karpenter.k8s.aws/v1
      kind: EC2NodeClass
      name: default
    amiFamily: AL2023
    limits:
      memory: 1100Gi
    # Karpenter 1.x only accepts WhenEmpty or WhenEmptyOrUnderutilized (WhenUnderutilized was the v1beta1 name for the latter);
    # the old value made the NodePool apply fail and blocked the whole cluster-level-resources sync.
    consolidationPolicy: "WhenEmptyOrUnderutilized"
    consolidateAfter: "1m"
    expireAfter: "72h"
    volumeSize: 80Gi
    requirements:
      - key: karpenter.sh/capacity-type
        operator: In
        values:
          - spot
      - key: kubernetes.io/arch
        operator: In
        values:
          - amd64
      - key: karpenter.k8s.aws/instance-memory
        operator: Gt
        values:
          - "7000"
      - key: karpenter.k8s.aws/instance-memory
        operator: Lt
        values:
          - "32500"
vpc-cni:
  enabled: true
  configuration:
    enabled: false
kube-proxy:
  enabled: true
external-secrets:
  enabled: true
  targetRevision: "0.16.2"
  configuration:
    enabled: false

# Crossplane manages AWS IAM for the siem service (see vectis-overlays siemService.crossplane). iamRoleName is the IAM role the
# Crossplane AWS provider assumes (IRSA); it must exist and be allowed to create IAM roles and policies.
crossplane:
  enabled: false

crossplane-crds:
  enable: false
  useIRSA: true
  iamRoleName: "crossplane-vectis"

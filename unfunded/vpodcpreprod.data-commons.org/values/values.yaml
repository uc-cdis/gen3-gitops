etl:
  esEndpoint: elasticsearch
  image:
    tube:
      tag: '2026.11'
    spark:
      tag: '2026.11'
  etlMapping:
    mappings:
      - name: etl_mickey_case
        doc_type: case
        type: aggregator
        root: case
        props:
          - name: project_id
          - name: submitter_id
        nested_props:
          - name: clinical_demographics
            path: clinical_demographics
            props:
              - name: Ethnicity
              - name: Gender
              - name: Race
          - name: exposures
            path: exposures
            props:
              - name: DRINK_CURRENT
              - name: DRINK_MIN_12
              - name: DRINK_BEER_FREQ
              - name: DRINK_WINE_FREQ
              - name: DRINK_LIQUOR_FREQ
              - name: DRINK_START_AGE
              - name: DRINK_STOP_AGE
              - name: DRINK_TOTAL_YEARS
              - name: SMOKE_CURRENT
              - name: SMOKE_MIN_100
              - name: SMOKE_DAILY_AMT
              - name: SMOKE_CIGAR_PIPE
              - name: SMOKE_SMOKELESS
              - name: SMOKE_START_AGE
              - name: SMOKE_STOP_AGE
              - name: SMOKE_TOTAL_YEARS
              - name: XP_AGENTORANGE
              - name: XP_ANTHRAX
              - name: XP_ASBESTOS
              - name: XP_BURNPIT
              - name: XP_CHROMIUM
              - name: XP_CONSTRUCT
              - name: XP_MICROWAVE
              - name: XP_MUSTARD
              - name: XP_NUCLEAR
              - name: XP_PAINT
              - name: XP_PERCHLORATE
              - name: XP_PESTICIDE
              - name: XP_PETROLEUM
              - name: XP_RADIATION
              - name: XP_RESP
              - name: XP_URANIUM
              - name: XP_WARFARE
              - name: XP_WOUNDS
              - name: XP_XRAY
              - name: XP_OTHER
              - name: MILITARY_ASSOCIATION
          - name: oncology_primaries
            path: oncology_primaries
            props:
              - name: Histologyicdo3X
              - name: ICDOSite
              - name: Stagegroupclinical
              - name: Texthistologytitle
              - name: Gradedifferentiation
              - name: Stagegroupbest
              - name: PrimarysiteX
          - name: somatic_mutations
            path: somatic_mutations
            props:
              - name: Gene
              - name: Mutation
      - name: etl_mickey_file
        doc_type: file
        type: collector
        root: None
        category: data_file
        props:
          - name: source_node

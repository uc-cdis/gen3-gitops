  portalApp: gitops
  publicDataSets: false
  tierAccessLevel: private
  tierAccessLimit: '100'
  netPolicy:
    enabled: false
  dispatcherJobNum: '10'
  frontendRoot: gen3ff
  ddEnabled: false


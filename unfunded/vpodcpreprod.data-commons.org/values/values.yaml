hatchery:
  enabled: true
  # prod keeps a hot node reserved for fast workspace start; off here so preprod does not hold
  # 5 CPU / 17Gi on the shared cluster
  hotNode:
    enabled: false
    gpu: false
    jupyter: true
    availabilityZones:
    - us-east-1c
    workspaceCapacityReservation:

# Updated preprod values.yaml
# Base: user-provided preprod values
# Applied: prod service enablement and image/version pins from user-provided prod values
# Review inferred preprod resources before deploy: argo-wrapper buckets, dashboard bucket/IRSA,
# cohort-middleware secret, ohdsi-webapi secret, ssjdispatcher secret, and sower/pelican secret.

global:
  argoHost: http://argo-workflows-server.argo.svc.cluster.local:2746
  aws:
    enabled: true
    account: '662843554732'
    awsEsProxyRole: gen3-service/unfunded-esproxy-sa
    hatchery_role: gen3_service/unfunded-vpodc-preprod-hatchery-sa
    secretStoreServiceAccount:
      enabled: true
      name: external-secrets
      roleArn: arn:aws:iam::662843554732:role/gen3_service/unfunded-vpodc-preprod-external-secrets-sa
    wafv2:
      enabled: true
      wafAclArn: arn:aws:wafv2:us-east-1:662843554732:regional/webacl/unfunded-waf/e10ae423-8e4e-48ba-9a0e-52b43f28f6d4
  dev: false
  externalSecrets:
    deploy: true
  postgres:
    dbCreate: true
    externalSecret: unfunded-aurora-master-password
  environment: unfunded
  hostname: vpodc-preprod.data-commons.org
  atlasUrl: https://atlas.vpodc-preprod.data-commons.org
  revproxyArn: arn:aws:acm:us-east-1:662843554732:certificate/056abcf2-3252-44c6-9a84-91d42ce65087

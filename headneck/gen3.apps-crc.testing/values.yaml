postgresql:
  primary:
    containerSecurityContext:
      allowPrivilegeEscalation: false
      runAsUser: 1000950000
      seccompProfile:
        type: RuntimeDefault
    persistence:
      enabled: false
    podSecurityContext:
      fsGroup: 1000950000
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 250m
        memory: 256Mi
requestor:
  enabled: false
  service:
    targetPort: 8000
revproxy:
  enabled: true
  nginx:
    pidFile: /tmp/nginx.pid
    resolver: 172.30.0.10
    user: nginx
  openshiftRoute:
    annotations: {}
    enabled: true
    host: gen3.apps-crc.testing
    path: /
    targetPort: http
    tls:
      insecureEdgeTerminationPolicy: Redirect
      termination: edge
    wildcardPolicy: None
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 128Mi

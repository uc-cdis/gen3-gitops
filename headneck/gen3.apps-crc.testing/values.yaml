  gunicorn:
    user: ''
    group: ''
  externalSecrets:
    pushSecret: true
manifestservice:
  enabled: true
  service:
    targetPort: 8000
  image:
    tag: test_openshift-support
  externalSecrets:
    pushSecret: true
metadata:
  enabled: true
  service:
    targetPort: 8000
  image:
    tag: test_openshift-support

elasticsearch:
  clusterHealthCheckParams: wait_for_status=yellow&timeout=1s
  clusterName: gen3-elasticsearch
  esConfig:
    elasticsearch.yml: ''
  image: quay.io/cdis/elasticsearch
  imageTag: 7.10.2
  maxUnavailable: 0
  podSecurityContext:
    fsGroup: 1000950000
    runAsUser: 1000950000
  replicas: 1
  securityContext:
    capabilities:
      drop:
      - ALL
    runAsNonRoot: true
    runAsUser: 1000950000
  singleNode: true
  sysctlInitContainer:
    enabled: false
fence:
  enabled: true
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 100m
      memory: 256Mi
  service:
    targetPort: 8000
  image:
    tag: test_openshift-support
  externalSecrets:
    pushSecret: true
    enabled: true
    createK8sGoogleAppSecrets: true
    createK8sJwtKeysSecret: true
    fenceConfig: hnc-fence-config
frontend-framework:
  enabled: true
  service:
    port: 80
    type: ClusterIP
  image:
    repository: quay.io/cdis/head-neck-data-commons
    tag: main
gen3-analysis:
  enabled: false
  service:
    targetPort: 8000
gen3-user-data-library:
  enabled: false
  service:
    targetPort: 8000
gen3-workflow:
  enabled: false
  service:
    targetPort: 8080
global:
  aws:
    region: us-east-1
    useLocalSecret:
      enabled: true
      localSecretName: "secret-store-user"
    externalSecrets:
      enabled: true
      pushSecret: true
  externalSecrets:
    apiVersion: external-secrets.io/v1beta1
    deploy: true
    pushSecret: true
  frontendRoot: gen3ff
  hostname: gen3.apps-crc.testing
  environment: openshift-test
  dev: true
  dictionaryUrl: https://s3.amazonaws.com/dictionary-artifacts/hnc_dictionary/0.2.2/schema.json
  rbac:
    clusterWide: false
  skipExistingJobs: true
guppy:
  enabled: true
  service:
    targetPort: 8000
  image:
    tag: test_openshift-support
  configIndex: hnc_array-config
  indices:
  - index: hnc_dataset
    type: dataset
  - index: hnc_subject
    type: subject
  - index: hnc_sample
    type: sample
  - index: hnc_imaging_study
    type: imaging_study
  - index: hnc_data_file

funnel:
  replicaCount: 2
  postgres:
    dbCreate: true
  externalSecrets:
    dbcreds: brhstaging-helm-funnel-creds
    funnelOidcClient: brhstaging-helm-funnel-oidc-client
  image:
    repository: quay.io/cdis/funnel
    tag: v0.13.0-gen3
  Logger:
    Level: debug
  Kubernetes:
    JobsNamespace: workflow-pods-brhstaging-helm
    DisableReconciler: false
    DisableJobCleanup: false
    ReconcileRate: 120s
    Storage:
      type: s3files
    Executor:
      restartPolicy: Never
      backoffLimit: 0
      # Annotations:
      #   karpenter.sh/do-not-disrupt: "true"
    Worker:
      restartPolicy: Never
      backoffLimit: 1
      # Annotations:
      #   karpenter.sh/do-not-disrupt: "true"
      # PriorityClassName: "system-cluster-critical"
    Resources:
      Limits:
        # Note: using `Cpus: "8"` instead of `8000m` triggers error `invalid value for string field Cpus: 8`
        Cpus: 12000m
        RamGb: 64Gi
        DiskGb: 100Gi

revproxy:
  replicaCount: 2
  enabled: true
  image:
    repository: quay.io/cdis/nginx
    tag: '2026.11'
  ingress:
    enabled: true
    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/tags: Environment=devplanetv2-ci
      alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:707767160287:certificate/f427a646-94fd-4b91-8bcd-80f5920c1e46
      alb.ingress.kubernetes.io/group.name: devplanetv2-ci
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS":443}]'
      alb.ingress.kubernetes.io/actions.ssl-redirect: '{"Type": "redirect", "RedirectConfig":
        { "Protocol": "HTTPS", "Port": "443", "StatusCode": "HTTP_301"}}'
      alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-Res-FIPS-2023-04
      alb.ingress.kubernetes.io/wafv2-acl-arn: arn:aws:wafv2:us-east-1:707767160287:regional/webacl/devplanetv2-waf/30660590-f707-4ecf-aeae-ddfbe381f388
    className: alb
    hosts:
      - host: HOSTNAME
        paths:
          - path: /
            pathType: Prefix
    resources:
      requests:
        memory: 105Mi
        cpu: 50m
  additionalConfigs:
    workspace-api.conf: "# Free tier is static JupyterLite assets rendered in-browser\
      \ (WASM only).\n# Do not gate these files on workspace launch authz checks.\n\
      location ^~ /api/workspace-assets/free/ {\n  if ($request_method = 'OPTIONS')\
      \ {\n    add_header Access-Control-Allow-Origin $http_origin always;\n    add_header\
      \ Access-Control-Allow-Credentials true always;\n    add_header Access-Control-Allow-Methods\
      \ \"GET, POST, DELETE, OPTIONS\" always;\n    add_header Access-Control-Allow-Headers\
      \ \"Authorization, Content-Type\" always;\n    add_header Content-Length 0;\n\
      \    add_header Content-Type text/plain;\n    return 204;\n  }\n  set $upstream\
      \ http://frontend-framework-service.$namespace.svc.cluster.local;\n  proxy_pass\
      \ $upstream;\n  proxy_http_version 1.1;\n  proxy_set_header Host $host;\n  proxy_set_header\
      \ X-Real-IP $remote_addr;\n  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n\
      \  proxy_set_header X-Forwarded-Proto https;\n  proxy_set_header X-Forwarded-Host\
      \ $host;\n  proxy_set_header X-URL-SCHEME https;\n  add_header Access-Control-Allow-Origin\
      \ $http_origin always;\n  add_header Access-Control-Allow-Credentials true always;\n\
      \  add_header Access-Control-Allow-Methods \"GET, POST, DELETE, OPTIONS\" always;\n\
      \  add_header Access-Control-Allow-Headers \"Authorization, Content-Type\" always;\n\
      \  client_max_body_size 0;\n  proxy_read_timeout 600s;\n}\n\nlocation ^~ /workspace-api/workspace-assets/free/\
      \ {\n  if ($request_method = 'OPTIONS') {\n    add_header Access-Control-Allow-Origin\
      \ $http_origin always;\n    add_header Access-Control-Allow-Credentials true\
      \ always;\n    add_header Access-Control-Allow-Methods \"GET, POST, DELETE,\
      \ OPTIONS\" always;\n    add_header Access-Control-Allow-Headers \"Authorization,\
      \ Content-Type\" always;\n    add_header Content-Length 0;\n    add_header Content-Type\
      \ text/plain;\n    return 204;\n  }\n    set $upstream http://frontend-framework-service.$namespace.svc.cluster.local;\n\
      \    rewrite ^/workspace-api/(.*) /api/$1 break;\n    proxy_pass $upstream;\n\
      \    proxy_http_version 1.1;\n    proxy_set_header Host $host;\n    proxy_set_header\
      \ X-Real-IP $remote_addr;\n    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n\
      \    proxy_set_header X-Forwarded-Proto https;\n    proxy_set_header X-Forwarded-Host\
      \ $host;\n    proxy_set_header X-URL-SCHEME https;\n    add_header Access-Control-Allow-Origin\
      \ $http_origin always;\n    add_header Access-Control-Allow-Credentials true\
      \ always;\n    add_header Access-Control-Allow-Methods \"GET, POST, DELETE,\
      \ OPTIONS\" always;\n    add_header Access-Control-Allow-Headers \"Authorization,\
      \ Content-Type\" always;\n    client_max_body_size 0;\n    proxy_read_timeout\
      \ 600s;\n}\n\n# Remote JupyterLite assets served by workspace-proxy (no auth\
      \ gate \u2014 static files).\nlocation ^~ /api/workspace-assets/remote/ {\n\
      \  if ($request_method = 'OPTIONS') {\n    add_header Access-Control-Allow-Origin\
      \ $http_origin always;\n    add_header Access-Control-Allow-Credentials true\
      \ always;\n    add_header Access-Control-Allow-Methods \"GET, POST, DELETE,\
      \ OPTIONS\" always;\n    add_header Access-Control-Allow-Headers \"Authorization,\
      \ Content-Type\" always;\n    add_header Content-Length 0;\n    add_header Content-Type\
      \ text/plain;\n    return 204;\n  }\n  set $upstream http://frontend-framework-service.$namespace.svc.cluster.local;\n\
      \  proxy_pass $upstream;\n  proxy_http_version 1.1;\n  proxy_set_header Host\
      \ $host;\n  proxy_set_header X-Real-IP $remote_addr;\n  proxy_set_header X-Forwarded-For\
      \ $proxy_add_x_forwarded_for;\n  proxy_set_header X-Forwarded-Proto https;\n\
      \  proxy_set_header X-Forwarded-Host $host;\n  proxy_set_header X-URL-SCHEME\
      \ https;\n  add_header Access-Control-Allow-Origin $http_origin always;\n  add_header\
      \ Access-Control-Allow-Credentials true always;\n  add_header Access-Control-Allow-Methods\
      \ \"GET, POST, DELETE, OPTIONS\" always;\n  add_header Access-Control-Allow-Headers\
      \ \"Authorization, Content-Type\" always;\n  client_max_body_size 0;\n  proxy_read_timeout\
      \ 600s;\n}\n\nlocation ^~ /workspace-api/workspace-assets/remote/ {\n  if ($request_method\
      \ = 'OPTIONS') {\n    add_header Access-Control-Allow-Origin $http_origin always;\n\
      \    add_header Access-Control-Allow-Credentials true always;\n    add_header\
      \ Access-Control-Allow-Methods \"GET, POST, DELETE, OPTIONS\" always;\n    add_header\
      \ Access-Control-Allow-Headers \"Authorization, Content-Type\" always;\n   \
      \ add_header Content-Length 0;\n    add_header Content-Type text/plain;\n  \
      \  return 204;\n  }\n    set $upstream http://frontend-framework-service.$namespace.svc.cluster.local;\n\
      \    rewrite ^/workspace-api/(.*) /api/$1 break;\n    proxy_pass $upstream;\n\
      \    proxy_http_version 1.1;\n    proxy_set_header Host $host;\n    proxy_set_header\
      \ X-Real-IP $remote_addr;\n    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n\
      \    proxy_set_header X-Forwarded-Proto https;\n    proxy_set_header X-Forwarded-Host\
      \ $host;\n    proxy_set_header X-URL-SCHEME https;\n    add_header Access-Control-Allow-Origin\
      \ $http_origin always;\n    add_header Access-Control-Allow-Credentials true\
      \ always;\n    add_header Access-Control-Allow-Methods \"GET, POST, DELETE,\
      \ OPTIONS\" always;\n    add_header Access-Control-Allow-Headers \"Authorization,\
      \ Content-Type\" always;\n    client_max_body_size 0;\n    proxy_read_timeout\
      \ 600s;\n}\n\n# Workspace API routes (hatchery options/status/launch, gateway,\
      \ kernel) are\n# handled by the vectis Next.js app API routes \u2014 NOT workspace-proxy.\n\
      # Next.js rewrites /workspace-api/:path* \u2192 /api/:path* internally.\nlocation\
      \ ^~ /workspace-api/workspace/ {\n    set $authz_resource \"/workspace\";\n\
      \    set $authz_method \"access\";\n    set $authz_service \"jupyterhub\";\n\
      \    auth_request /gen3-authz;\n    error_page 403 = @errorworkspace;\n    set\
      \ $upstream http://frontend-framework-service.$namespace.svc.cluster.local;\n\
      \    proxy_pass $upstream;\n    proxy_http_version 1.1;\n    proxy_set_header\
      \ Host $host;\n    proxy_set_header X-Real-IP $remote_addr;\n    proxy_set_header\
      \ X-Forwarded-For $proxy_add_x_forwarded_for;\n    proxy_set_header X-Forwarded-Proto\
      \ https;\n    proxy_set_header X-Forwarded-Host $host;\n    proxy_set_header\
      \ X-URL-SCHEME https;\n    client_max_body_size 0;\n    proxy_read_timeout 600s;\n\
      }\n\n# JupyterLab kernel tunnel (workspace-proxy handles per-user routing).\n\
      location ^~ /workspace-api/ {\n    set $authz_resource \"/workspace\";\n   \
      \ set $authz_method \"access\";\n    set $authz_service \"jupyterhub\";\n  \
      \  auth_request /gen3-authz;\n    error_page 403 = @errorworkspace;\n    set\
      \ $upstream http://workspace-proxy-service.$namespace.svc.cluster.local:8080;\n\
      \    rewrite ^/workspace-api/(.*) /api/$1 break;\n    proxy_pass $upstream;\n\
      \    proxy_http_version 1.1;\n    proxy_set_header Host $host;\n    proxy_set_header\
      \ X-Real-IP $remote_addr;\n    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n\
      \    proxy_set_header X-Forwarded-Proto https;\n    proxy_set_header X-Forwarded-Host\
      \ $host;\n    proxy_set_header X-URL-SCHEME https;\n    client_max_body_size\
      \ 0;\n    proxy_read_timeout 600s;\n}"
    ambassador-service.conf: |-
      location = /lw-workspace/proxy {
        return 308 $scheme://$http_host/lw-workspace/proxy/;
      }

      location /lw-workspace/proxy/ {
          set $authz_resource "/workspace";
          set $authz_method "access";
          set $authz_service "jupyterhub";
          auth_request_set $remoteUser $upstream_http_REMOTE_USER;
          auth_request_set $saved_set_cookie $upstream_http_set_cookie;
          auth_request /gen3-authz;

          if ($saved_set_cookie != "") {
              add_header Set-Cookie $saved_set_cookie always;
          }
          add_header Cache-Control "no-store";

          proxy_set_header REMOTE_USER $remoteUser;
          error_page 403 = @errorworkspace;

          set $proxy_service  "workspace-proxy";
          set $upstream http://workspace-proxy-service.$namespace.svc.cluster.local:8080;
          rewrite ^/lw-workspace/proxy/$ /lab break;
          rewrite ^/lw-workspace/proxy/(.*) /$1 break;
          proxy_pass $upstream;
          proxy_redirect http://$host/ https://$host/lw-workspace/proxy/;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto https;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          proxy_set_header X-URL-SCHEME https;
          client_max_body_size 0;
          proxy_read_timeout 36000s;
      }

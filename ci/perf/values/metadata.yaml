metadata:
  replicaCount: 2
  image:
    repository: quay.io/cdis/metadata-service
    tag: 'master'
  resources:
    # -- (map) The amount of resources that the container requests
    requests:
      memory: 25Mi
  enabled: true
  externalSecrets:
    createK8sMetadataSecret: true
    pushSecret: false
    dbcreds: "ci-perf-metadata-creds"
  postgres:
    dbCreate: false
  useAggMds: "True"
  aggMdsNamespace: default
  esEndpoint: http://elasticsearch:9200
  aggMdsConfig: |
    {
      "gen3_commons": {
        "HEAL": {
          "mds_url": "http://revproxy-service",
          "commons_url": "http://revproxy-service"
        }
      },
      "adapter_commons": {}
    }

peregrine:
  replicaCount: 2
  resources:
    requests:
      memory: "105Mi"
      cpu: "50m"
  enabled: true
  image:
    repository: "quay.io/cdis/peregrine"
    tag: "master"
    pullPolicy: Always
  externalSecrets:
    pushSecret: true
    dbcreds: "ci-perf-peregrine-creds"
  postgres:
    dbCreate: true

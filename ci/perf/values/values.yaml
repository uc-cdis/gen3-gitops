global:
  # This will be dynamically replaced by env_setup.sh script.
  hostname:
  dev: false
  dictionaryUrl: https://s3.amazonaws.com/dictionary-artifacts/gtexdictionary/4.6.4/schema.json
  pdb: true
  crossplane:
    enabled: false
    oidcProviderUrl: "oidc.eks.us-east-1.amazonaws.com/id/F057519C0E32B7DE2580904C4007BB21"
    accountId: "707767160287"
  aws:
    account: "707767160287"
    awsEsProxyRole: devplanetv2--ci-perf--es-access
    enabled: true    
    externalSecrets:
      # -- (bool) Whether to use External Secrets for aws config.
      enabled: true
      # -- (String) Name of Secrets Manager secret.
      externalSecretAwsCreds: ci-aws-config
    secretStoreServiceAccount:
      # -- (bool) Set true if deploying to AWS and want to use service account and IAM role instead of aws keys. Must provide role-arn.
      enabled: true
      # -- (string) Name of the service account to create
      name: secret-store-sa
      # -- (string) AWS Role ARN for Secret Store to use
      roleArn: arn:aws:iam::707767160287:role/devplanetv2-external-secrets-sa
    sower_role: sower-jobs-role
  postgres:
    dbCreate: true
    externalSecret: "devplanetv2-ciperf-aurora-master-password"
    master:
      host: devplanetv2-perf-aurora-cluster.cluster-cwvizkxhzjt8.us-east-1.rds.amazonaws.com
  clusterName: devplanetv2
  environment: ci-perf
  externalSecrets:
    deploy: true
    pushFunnelOidcClientToExternalSecrets: false
  # This will be dynamically replaced by env_setup.sh script.
  fenceURL: https://hostname/user
  manifestGlobalExtraValues:
    google_enabled: true
  tierAccessLevel: libre
  topologySpread:
    # -- (bool) Whether to enable topology spread constraints for all subcharts that support it.
    enabled: true
    # -- (string) The topology key to use for spreading. Defaults to "topology.kubernetes.io/zone".
    topologyKey: "topology.kubernetes.io/zone"
    # -- (int) The maxSkew to use for topology spread constraints. Defaults to 1.
    maxSkew: 1

mutatingWebhook:
  # -- (bool) Whether to deploy the mutating webhook service.
  enabled: false

aws-sigv4-proxy:
  enabled: true
  esEndpoint: vpc-devplanetv2-gen3-metadata-2-xkwr2f3gbxua5mqqi7rhnat4la.us-east-1.es.amazonaws.com

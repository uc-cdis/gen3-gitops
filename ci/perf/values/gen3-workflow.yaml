gen3-workflow:
  enabled: false
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
  resources:
    limits:
      cpu: 2
    requests:
      cpu: 2
      memory: 850Mi
  image:
    repository: quay.io/cdis/gen3-workflow
    tag: master
  serviceAccount:
    create: true
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::707767160287:role/ci-gen3-workflow
  GEN3_WORKFLOW_CONFIG:
    APP_DEBUG: true
    TASK_IMAGE_WHITELIST:
      - "public.ecr.aws/docker/library/alpine:latest"
      - "quay.io/biocontainers/ubuntu:24.04"
      - "python:3.13-slim"
      - "pytorch/pytorch:latest"
    DPOP_REQUIRED: true
    DPOP_SHARED_SECRET: dummy-value-not-a-secret
    ENABLE_S3_FILES: true
    EKS_SECURITY_GROUP_NAMES: ["devplanetv2_EKS_workers_sg", "devplanetv2_EKS_nodepool_jupyter_sg"]

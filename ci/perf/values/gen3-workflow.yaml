gen3-workflow:
  enabled: false
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
  resources:
    limits:
      cpu: 2
    requests:
      cpu: 2
      memory: 850Mi
  image:
    repository: quay.io/cdis/gen3-workflow
    tag: s3-list-buckets-support
  serviceAccount:
    create: true
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::707767160287:role/ci-gen3-workflow
  gen3WorkflowConfig:
    debug: true
    nWorkers: 4
    taskImageWhitelist:
      - "public.ecr.aws/docker/library/alpine:latest" # for test_happy_path_create_tes_task
      - "quay.io/cdis/gen3-workflow:integration_tests_dicom_image" # for test_nextflow_workflow
      - "quay.io/curl/curl:latest" # for test_access_internal_endpoints
      - "quay.io/biocontainers/ubuntu:24.04" # for test_nf_canary
      - "pytorch/pytorch:latest" # for test_nf_canary TEST_GPU
